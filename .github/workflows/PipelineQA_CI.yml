name: CI - FAPROBO Desktop

on:
 workflow_dispatch:
  push:
    branches: [ QA ]
  pull_request:
    

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13','3.14']
      fail-fast: false

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          path: faprobo

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtual environment
        uses: actions/cache@v4
        with:
          path: faprobo/.venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('faprobo/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install project dependencies
        working-directory: faprobo
        run: poetry install --no-interaction

      - name: Install system dependencies for PySide6 (headless)
         run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
          libegl1 \
          libgl1 \
          libxcb-xinerama0 \
          libxkbcommon-x11-0 \
          libxcb-cursor0 \
          libglib2.0-0 \
          libdbus-1-3 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0

      - name: Set Qt Offscreen Platform
        run: echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

      - name: Show environment info
        working-directory: faprobo
        run: |
          echo "Python version:"
          poetry run python --version
          echo "Installed packages:"
          poetry run pip list

      - name: Smoke Test
        working-directory: faprobo
        run: poetry run poe smoke

      - name: Run CI Tasks
        working-directory: faprobo
        run: poetry run poe ci
